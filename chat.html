<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; font-family:'Inter',system-ui,-apple-system,sans-serif; color:#fff; height:100vh; overflow:hidden; }

    /* ─── NAME GATE ─── */
    #nameGate {
      position:fixed; inset:0; z-index:100; background:#000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px; transition: opacity .5s ease;
    }
    #nameGate h2 { font-size:1.4rem; margin-bottom:6px; font-weight:600; }
    #nameGate p { color:#888; font-size:.85rem; margin-bottom:24px; }
    #nameGate input {
      width:100%; max-width:280px; padding:14px 18px; border-radius:14px;
      background:#1c1c1e; border:1px solid #333; color:#fff; font-size:1rem;
      font-family:inherit; text-align:center; outline:none;
    }
    #nameGate input:focus { border-color:#007aff; }
    #nameGate button {
      margin-top:12px; padding:12px 40px; border-radius:50px; border:none;
      background:#007aff; color:#fff; font-size:.95rem; font-weight:600;
      cursor:pointer; font-family:inherit;
    }

    /* ─── IMESSAGE UI ─── */
    #chatScreen { display:none; height:100vh; flex-direction:column; }

    .chat-topbar {
      display:flex; align-items:center; gap:12px; padding:52px 16px 12px;
      background:rgba(0,0,0,.85); backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,.08); position:relative;
    }
    .chat-topbar .back { color:#007aff; font-size:1.3rem; text-decoration:none; }
    .chat-avatar { width:34px; height:34px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; font-size:.85rem; }
    .chat-contact { flex:1; }
    .chat-contact .name { font-size:.95rem; font-weight:600; }
    .chat-contact .status { font-size:.7rem; color:#888; }

    .chat-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; -webkit-overflow-scrolling:touch; }

    .msg-wrapper { display:flex; max-width:78%; animation: msgIn .35s ease both; }
    .msg-wrapper.left { align-self:flex-start; }
    .msg-wrapper.right { align-self:flex-end; }

    .msg {
      padding:9px 14px; border-radius:18px; font-size:.93rem; line-height:1.35;
      word-wrap:break-word; position:relative;
    }
    .msg-wrapper.left .msg { background:#1c1c1e; color:#fff; border-bottom-left-radius:4px; }
    .msg-wrapper.right .msg { background:#007aff; color:#fff; border-bottom-right-radius:4px; }

    .msg-img { max-width:220px; border-radius:16px; overflow:hidden; }
    .msg-img img { width:100%; display:block; }

    .msg-time { font-size:.65rem; color:#555; text-align:center; padding:8px 0; }

    /* Typing indicator */
    .typing { display:flex; gap:4px; padding:12px 16px; background:#1c1c1e; border-radius:18px; border-bottom-left-radius:4px; align-items:center; }
    .typing span { width:7px; height:7px; background:#888; border-radius:50%; animation:typeDot 1.4s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay:.2s; }
    .typing span:nth-child(3) { animation-delay:.4s; }
    @keyframes typeDot { 0%,60%,100%{opacity:.3;transform:scale(.8)} 30%{opacity:1;transform:scale(1)} }

    /* Receipt */
    .receipt { font-size:.65rem; color:#888; text-align:right; padding:2px 4px 0; transition:color .3s; }
    .receipt.read { color:#007aff; }

    /* Sticker */
    .sticker { font-size:3rem; padding:4px; animation: stickerPop .4s cubic-bezier(.68,-.55,.27,1.55) both; }
    @keyframes stickerPop { from{transform:scale(0)} to{transform:scale(1)} }

    /* ─── ORDER CARD ─── */
    #orderCard {
      position:fixed; bottom:0; left:0; right:0; padding:16px;
      transform:translateY(140%); z-index:50;
    }
    #orderCard.show { transform:translateY(0); }
    .card-app {
      background:rgba(28,28,30,.9); backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.1); border-radius:20px;
      padding:20px; text-align:center;
      transition:transform .25s ease, box-shadow .25s ease;
      box-shadow:0 10px 40px rgba(0,0,0,.6);
    }
    .card-app:active { transform:scale(.96); box-shadow:0 6px 20px rgba(0,0,0,.8); }
    .card-app h3 { font-size:1.3rem; font-weight:700; letter-spacing:.04em; }
    .card-app h3 em { color:#ff2d2d; font-style:normal; }
    .card-app p { color:#888; font-size:.8rem; margin:6px 0 16px; }
    .card-app a {
      display:inline-block; padding:12px 36px; background:#ff2d2d; color:#fff;
      border-radius:50px; font-weight:600; font-size:.9rem; text-decoration:none;
      box-shadow:0 0 30px rgba(255,45,45,.35);
    }

    @keyframes msgIn { from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(2px)} to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
  </style>
</head>
<body>

  <!-- NAME GATE -->
  <div id="nameGate">
    <h2>What's your name?</h2>
    <p>to start the convo</p>
    <input type="text" id="nameInput" placeholder="your name" maxlength="20" autocomplete="off">
    <button onclick="startChat()">LET'S GO</button>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="chat-topbar">
      <a href="index.html" class="back">‹</a>
      <div class="chat-avatar">🍕</div>
      <div class="chat-contact">
        <div class="name" id="contactName">Bestie</div>
        <div class="status">online</div>
      </div>
    </div>
    <div class="chat-body" id="chat"></div>
  </div>

  <!-- ORDER CARD -->
  <div id="orderCard">
    <div class="card-app">
      <h3>CRUSTY <em>AF</em></h3>
      <p>Open till 4AM · 20 min delivery</p>
      <a href="index.html">ORDER NOW 🍕</a>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
